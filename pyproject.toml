[project]
name = "w1-py-template"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "shenshaonian", email = "shenshaonian@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E","F","W","I","N","UP","B","C4","SIM","RET","ARG","PTH","RUF"]
# RUF002/RUF003：中文文档和注释必然用全角标点（：（）、，），对中文项目不适用
ignore = ["RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# 测试函数名用中文（test_add_正数）可读性好，只对 tests 放宽命名规则 N802
"tests/*" = ["N802"]

[tool.mypy]
strict = true
files = ["src"]
